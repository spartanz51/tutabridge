name: SDK bump

# Cron has no fortnightly syntax. The date guard permits every other Monday.
# SDK tests run without credentials; fresh Git-only jobs publish/integrate.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Official Tuta tag (empty selects latest)"
        required: false
      dry_run:
        description: "Verify SDK only; no branch, PR, tag or release writes"
        type: boolean
        default: false

concurrency:
  group: sdk-bump
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      base: ${{ steps.detect.outputs.base }}
      source: ${{ steps.detect.outputs.source }}
      tag: ${{ steps.detect.outputs.tag }}
      upstream: ${{ steps.detect.outputs.upstream }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select SDK or resume pending release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          [ "$DRY_RUN" != true ] || args+=(--dry-run)
          [ "$EVENT_NAME" != schedule ] || args+=(--scheduled)
          python3 scripts/sdk-release.py detect --tag "$INPUT_TAG" "${args[@]}"

  verify:
    # Runs the release's code: see the trust boundary above. No `uses:` here.
    needs: detect
    if: needs.detect.outputs.mode == 'bump'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {}
    outputs:
      generated: ${{ steps.generate.outputs.generated }}
      message: ${{ steps.generate.outputs.message }}
      lock_diff: ${{ steps.lock.outputs.lock_diff }}
      lock_hash: ${{ steps.lock.outputs.lock_hash }}
    env:
      TAG: ${{ needs.detect.outputs.tag }}
      COMMIT: ${{ needs.detect.outputs.upstream }}
      BASE: ${{ needs.detect.outputs.base }}
    steps:
      - name: Clone this repository and the official SDK
        run: |
          git clone --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout --quiet "$BASE"
          git submodule update --init --quiet tuta-repo

      # Same as the CI's Linux job: the SDK tests build the rustls stack.
      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y cmake nasm libdbus-1-dev pkg-config
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      # A hosted runner gives its user passwordless sudo and the docker
      # socket: two roads to root, and from there to the runner process,
      # whose token writes the caches that CI and the release restore. Both
      # are closed before the release's code runs. Less reach, not none: the
      # runner process itself is still there.
      - name: Give up root
        run: |
          sudo systemctl stop docker.socket docker containerd 2>/dev/null || true
          sudo bash -c 'chmod 600 /var/run/docker.sock 2>/dev/null; rm -f /etc/sudoers.d/*; sed -i "/NOPASSWD/d" /etc/sudoers'
          if sudo -n true 2>/dev/null; then
            echo "::error::sudo is still available"
            exit 1
          fi
          if docker info >/dev/null 2>&1; then
            echo "::error::docker is still available"
            exit 1
          fi

      - name: Point sdk/BASE at the release
        run: |
          sed -i -e "s/^tag=.*/tag=$TAG/" -e "s/^commit=.*/commit=$COMMIT/" sdk/BASE
          git -C tuta-repo fetch --quiet https://github.com/tutao/tutanota.git "$COMMIT"
          git -C tuta-repo checkout --quiet --detach "$COMMIT"
          git add tuta-repo
          cat sdk/BASE

      # After every patch the SDK must be formatted and pass its tests. The
      # final diagnostic is included in the job summary. Explicit bash
      # enables pipefail, so the status is the preparer's, not tee's.
      - name: Regenerate the SDK and verify every patch
        id: generate
        shell: bash
        run: |
          status=0
          python3 scripts/sdk-prepare.py --update-expected --verify-each 2>&1 | tee generate.log || status=$?
          {
            if [ "$status" -eq 0 ]; then
              echo "generated=$(sed -n 's/^tree=//p' sdk/EXPECTED)"
            else
              echo "generated="
            fi
            echo "message=$(tail -n 1 generate.log | tr -d '`' | cut -c 1-300)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Release: $TAG, generator status: $status"
            echo
            echo '```'
            tail -n 15 generate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Resolve bridge lockfile and verify locked metadata
        id: lock
        run: python3 scripts/sdk-release.py lock

  candidate:
    needs: [detect, verify]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.mode == 'bump' && !inputs.dry_run && !cancelled()
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.candidate.outputs.source }}
      version: ${{ steps.candidate.outputs.version }}
      ready: ${{ steps.candidate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.base }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Prepare with Git and publish the verified bridge candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.SDK_BUMP_TOKEN }}
          BASE: ${{ needs.detect.outputs.base }}
          TAG: ${{ needs.detect.outputs.tag }}
          UPSTREAM_SHA: ${{ needs.detect.outputs.upstream }}
          VERSION: ${{ needs.detect.outputs.version }}
          VERIFIED: ${{ needs.verify.result }}
          GENERATED: ${{ needs.verify.outputs.generated }}
          LOCK_DIFF: ${{ needs.verify.outputs.lock_diff }}
          LOCK_HASH: ${{ needs.verify.outputs.lock_hash }}
        run: python3 scripts/sdk-release.py candidate

  # The candidate PR also runs ordinary PR CI; this explicit call is the
  # integration gate and never depends on token-triggered workflow events.
  bridge-ci:
    needs: [detect, candidate]
    if: always() && !cancelled() && (needs.detect.outputs.mode == 'resume' || needs.candidate.outputs.ready == 'true')
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.candidate.outputs.source || needs.detect.outputs.source }}

  integrate:
    needs: [detect, verify, candidate, bridge-ci]
    if: always() && !cancelled() && needs.bridge-ci.result == 'success' && needs.candidate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fast-forward the exact tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.candidate.outputs.source }}
          BASE: ${{ needs.detect.outputs.base }}
          GENERATED: ${{ needs.verify.outputs.generated }}
        run: python3 scripts/sdk-release.py integrate

  release:
    needs: [detect, candidate, bridge-ci, integrate]
    if: always() && !cancelled() && needs.detect.result == 'success' && (needs.detect.outputs.mode == 'repair' || (needs.bridge-ci.result == 'success' && (needs.integrate.result == 'success' || needs.detect.outputs.mode == 'resume')))
    permissions:
      contents: write
      packages: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.candidate.outputs.source || needs.detect.outputs.source }}
      version: ${{ needs.candidate.outputs.version || needs.detect.outputs.version }}
      publish: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
