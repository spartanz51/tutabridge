name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    # Full check on macOS: the GUI (Tauri) builds here, plus fmt / clippy /
    # tests for the whole workspace.
    runs-on: macos-latest
    steps:
      - name: Checkout (with official SDK submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Prepare and verify patched SDK
        shell: bash
        run: |
          if [ -f scripts/sdk-prepare.py ]; then
            if [ "$RUNNER_OS" = Windows ]; then
              python scripts/sdk-prepare.py
            else
              python3 scripts/sdk-prepare.py
            fi
          else
            scripts/sdk-generate.sh --check
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo and ./target — the SDK + aws-lc-sys + pqcrypto are
      # heavy, so without this a run takes ~10 min.
      - name: Cache cargo build
        if: inputs.ref == ''
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The GUI crate's build script (tauri-build) needs the frontend bundle
      # at ui/dist, so the frontend has to be built before any cargo step
      # that compiles `tutabridge-gui`.
      - name: Build frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Typecheck frontend
        working-directory: ui
        run: npx tsc --noEmit

      # Scope to our crates explicitly — `--all` would descend into the
      # vendored SDK submodule (its own workspace), which we don't format.
      - name: Rustfmt
        run: cargo fmt --check -p tutabridge -p tutabridge-core -p tutabridge-gui -p tutabridge-tuta

      # Advisory for now — the codebase still has a handful of clippy lints.
      # Tighten to `-- -D warnings` once they're cleared.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace

      - name: Test release coordination
        run: python3 -m unittest discover -s scripts/tests -v

  linux-cli:
    # Proves the headless CLI + core build and test on Linux — i.e. that the
    # AUR / daemon target is buildable without the GUI's native deps
    # (no gtk / webkit). The GUI is intentionally not built here.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with official SDK submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Prepare and verify patched SDK
        shell: bash
        run: |
          if [ -f scripts/sdk-prepare.py ]; then
            if [ "$RUNNER_OS" = Windows ]; then
              python scripts/sdk-prepare.py
            else
              python3 scripts/sdk-prepare.py
            fi
          else
            scripts/sdk-generate.sh --check
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        if: inputs.ref == ''
        uses: Swatinem/rust-cache@v2

      # aws-lc-sys (rustls stack) needs cmake + nasm; libdbus-1-dev +
      # pkg-config are needed by libdbus-sys, pulled in by the keyring
      # Secret Service backend on Linux.
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake nasm libdbus-1-dev pkg-config

      - name: Build CLI (lean, no GUI)
        run: cargo build --locked --release -p tutabridge

      - name: Test core and the SDK extensions
        run: cargo test --locked -p tutabridge-core -p tutabridge-tuta

  android-cli:
    # Compile and link the CLI and all native dependencies for Termux. This
    # catches cfg/android regressions; it does not replace testing on a device.
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      ANDROID_API: "24"
    steps:
      - name: Checkout (with official SDK submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Prepare and verify patched SDK
        run: python3 scripts/sdk-prepare.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake nasm

      - name: Install Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Cache cargo build
        if: inputs.ref == ''
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64-ndk${{ env.ANDROID_NDK_VERSION }}

      - name: Build Android CLI (including native linking)
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          ndk_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$ndk_bin:$PATH"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android${ANDROID_API}-clang"
          export CXX_aarch64_linux_android="$ndk_bin/aarch64-linux-android${ANDROID_API}-clang++"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo build --locked -p tutabridge --target aarch64-linux-android

      - name: Upload experimental Android CLI
        uses: actions/upload-artifact@v4
        with:
          name: tutabridge-android-aarch64
          path: target/aarch64-linux-android/debug/tutabridge
          if-no-files-found: error
          retention-days: 14

  desktop:
    # Compile the platform-specific tray and single-instance implementations.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (with official SDK submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Prepare and verify patched SDK
        shell: bash
        run: |
          if [ -f scripts/sdk-prepare.py ]; then
            if [ "$RUNNER_OS" = Windows ]; then
              python scripts/sdk-prepare.py
            else
              python3 scripts/sdk-prepare.py
            fi
          else
            scripts/sdk-generate.sh --check
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        if: inputs.ref == ''
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev cmake nasm libdbus-1-dev pkg-config

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Check desktop
        run: cargo check --locked -p tutabridge-gui --features tauri/custom-protocol
