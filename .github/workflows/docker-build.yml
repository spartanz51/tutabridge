name: Native Docker archive
on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      version:
        type: string
        required: true
      created:
        type: string
        required: true
      arch:
        type: string
        required: true
      runner:
        type: string
        required: true
    outputs:
      sha256:
        value: ${{ jobs.build.outputs.sha256 }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      sha256: ${{ steps.image.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          ref: ${{ inputs.source }}
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: image
        name: Build and test the exact exported image without credentials
        env:
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ inputs.source }}
          CREATED: ${{ inputs.created }}
          ARCH: ${{ inputs.arch }}
        run: |
          bash automation/scripts/install-regctl.sh "$RUNNER_TEMP/tools"
          export PATH="$RUNNER_TEMP/tools:$PATH"
          cd source
          python3 scripts/sdk-prepare.py
          docker buildx build --platform "linux/$ARCH" --provenance=false --sbom=false --no-cache \
            --build-arg "TUTABRIDGE_VERSION=$VERSION" --build-arg "TUTABRIDGE_REVISION=$SOURCE" \
            --build-arg "TUTABRIDGE_CREATED=$CREATED" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$SOURCE" \
            --label "org.opencontainers.image.created=$CREATED" \
            --label org.opencontainers.image.source=https://github.com/spartanz51/tutabridge \
            --label org.opencontainers.image.licenses=GPL-3.0-or-later \
            --output type=oci,dest=image.tar .
          tested=$(sha256sum image.tar | cut -d " " -f1)
          regctl image import ocidir://smoke:release image.tar
          regctl image export ocidir://smoke:release --name tutabridge:test | docker load
          test "$(docker run --rm tutabridge:test --version)" = "tutabridge $VERSION"
          TUTABRIDGE_DOCKER_IMAGE=tutabridge:test python3 -m unittest discover -s scripts/tests -p test_docker_smoke.py -v
          test "$tested" = "$(sha256sum image.tar | cut -d " " -f1)"
          echo "sha256=$tested" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: docker-${{ inputs.arch }}
          path: source/image.tar
          compression-level: 0
          if-no-files-found: error

