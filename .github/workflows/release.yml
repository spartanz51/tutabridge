name: Release

# Manual runs default to previews; publish=true also supports bridge-only
# releases and a higher-version rollback from an older main SHA.
# Automated publication is called explicitly by
# sdk-bump after exact-source CI and integration; token pushes need no chaining.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source commit (empty uses this branch)"
        required: false
      version:
        description: "Preview version, X.Y.Z-rc.N"
        default: "0.1.0-rc.0"
        required: true
      publish:
        description: "Publish after full CI (explicit version and main source required)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      version:
        type: string
        required: true
      publish:
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

concurrency:
  group: ${{ inputs.publish && 'release-publication' || format('release-preview-{0}', github.run_id) }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      sdk: ${{ steps.docker-preflight.outputs.sdk }}
      created: ${{ steps.docker-preflight.outputs.created }}
      mode: ${{ steps.docker-preflight.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        name: Resolve immutable source
        env:
          SOURCE_REF: ${{ inputs.ref || github.sha }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse --verify --end-of-options "$SOURCE_REF^{commit}")
          if [ "$PUBLISH" = true ]; then
            python3 scripts/release-assets.py check-source --source "$sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check Docker activation, identity and recovery state
        id: docker-preflight
        env:
          SOURCE: ${{ steps.source.outputs.sha }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$(git ls-tree "$SOURCE" -- Dockerfile)" || { echo 'This source predates Docker support'; exit 1; }
          args=()
          [ "$PUBLISH" != true ] || args+=(--publish)
          python3 scripts/docker-release.py preflight --source "$SOURCE" --version "$VERSION" "${args[@]}"
          echo "sdk=$(git rev-parse "$SOURCE:tuta-repo")" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI "$SOURCE")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.docker-preflight.outputs.mode != 'build'
        with:
          overwrite: true
          name: docker-record
          path: docker-release.json
          if-no-files-found: error

  registry-preflight:
    needs: source
    if: inputs.publish
    runs-on: ubuntu-24.04
    environment: docker-hub
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.source.outputs.mode != 'build'
        with:
          name: docker-record
      - name: Read registry state before any build or signature
        env:
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ needs.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/docker-release.py registry-preflight --version "$VERSION" --source "$SOURCE"

  manual-ci:
    needs: [source, registry-preflight]
    if: inputs.publish && github.workflow == 'Release' && needs.source.outputs.mode != 'repair'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  build:
    needs: [source, registry-preflight, manual-ci]
    if: always() && !cancelled() && needs.source.result == 'success' && needs.source.outputs.mode != 'repair' && (needs.registry-preflight.result == 'success' || !inputs.publish) && (needs.manual-ci.result == 'success' || (!inputs.publish || github.workflow != 'Release') && needs.manual-ci.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            bundle_path: target/universal-apple-darwin/release/bundle
          - platform: ubuntu-latest
            rust_targets: ""
            tauri_args: ""
            bundle_path: target/release/bundle
          - platform: windows-latest
            rust_targets: ""
            tauri_args: ""
            bundle_path: target/release/bundle
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: automation
          persist-credentials: false
      - name: Checkout exact build source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          ref: ${{ needs.source.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare and verify patched SDK
        working-directory: source
        shell: bash
        run: |
          if [ -f scripts/sdk-prepare.py ]; then
            python scripts/sdk-prepare.py
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev cmake nasm libdbus-1-dev pkg-config
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Install frontend and pinned bundler
        working-directory: source/ui
        run: |
          npm ci
          npm install --global @tauri-apps/cli@2.11.2
      - name: Set version without updater signing in the build job
        working-directory: source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python ../automation/scripts/release-assets.py prepare --version "$RELEASE_VERSION"
        shell: bash
      - name: Build bundles and CLI without signing credentials
        if: runner.os != 'Windows'
        working-directory: source
        shell: bash
        env:
          TAURI_ARGS: ${{ matrix.tauri_args }}
          TUTABRIDGE_VERSION: ${{ inputs.version }}
        run: |
          args=()
          if [ -n "$TAURI_ARGS" ]; then read -r -a args <<< "$TAURI_ARGS"; fi
          tauri build "${args[@]}" -- --locked
          cargo build --locked --release -p tutabridge
      - name: Build Windows bundles and CLI with native tools
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        env:
          TUTABRIDGE_VERSION: ${{ inputs.version }}
        run: |
          tauri.cmd build --% -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release -p tutabridge
      - name: Check that the CLI reports the release version
        working-directory: source
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Older rollback sources predate --version; do not start their bridge.
          test -r crates/bridge/src/lib.rs
          if ! grep -Fq 'option_env!("TUTABRIDGE_VERSION")' crates/bridge/src/lib.rs; then
            echo "Legacy source: CLI version check is not supported"
            exit 0
          fi
          cli=target/release/tutabridge
          if [ "$RUNNER_OS" = Windows ]; then cli="$cli.exe"; fi
          reported=$("$cli" --version)
          echo "$reported"
          test "$reported" = "tutabridge $RELEASE_VERSION"
      - name: Prepare standard updater payloads and installers
        working-directory: source
        shell: bash
        env:
          BUNDLE_PATH: ${{ matrix.bundle_path }}
          PLATFORM: ${{ runner.os }}
        run: python ../automation/scripts/release-assets.py collect --bundle "$BUNDLE_PATH" --platform "$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: unsigned-${{ runner.os }}
          path: source/release-assets/*
          if-no-files-found: error

  sign:
    needs: [source, build]
    if: always() && !cancelled() && !inputs.publish && needs.source.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A new runner: no SDK checkout, compilation, or restored build cache.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned signer and signature verifier
        run: |
          npm install --global @tauri-apps/cli@2.11.2
          sudo apt-get update && sudo apt-get install -y minisign
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: unsigned-*
          path: release-assets
          merge-multiple: true
      - name: Prepare preview key
        if: ${{ !inputs.publish }}
        run: |
          tauri signer generate --ci --password '' --write-keys "$RUNNER_TEMP/preview.key" > /dev/null
          cp "$RUNNER_TEMP/preview.key.pub" "$RUNNER_TEMP/updater.pub"
      - name: Preserve preview public key for independent verification
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: preview-public-key
          path: ${{ runner.temp }}/updater.pub
          if-no-files-found: error
      - name: Sign preview and validate manifest
        if: ${{ !inputs.publish }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/preview.key")
          export TAURI_SIGNING_PRIVATE_KEY
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=''
          python3 scripts/release-assets.py sign --version "$RELEASE_VERSION" --pubkey "$RUNNER_TEMP/updater.pub"
      - name: Preserve complete signed release for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: signed-release
          path: release-assets/*
          if-no-files-found: error

  sign-production:
    environment: docker-hub
    needs: [source, build]
    if: always() && !cancelled() && inputs.publish && needs.source.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A new runner: no SDK checkout, compilation, or restored build cache.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned signer and signature verifier
        run: |
          npm install --global @tauri-apps/cli@2.11.2
          sudo apt-get update && sudo apt-get install -y minisign
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: unsigned-*
          path: release-assets
          merge-multiple: true
      - name: Read application public key
        if: inputs.publish
        env:
          SOURCE: ${{ needs.source.outputs.sha }}
        run: |
          git show "$SOURCE:src-tauri/tauri.conf.json" > "$RUNNER_TEMP/app-config.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          key = json.loads((root / 'app-config.json').read_text())['plugins']['updater']['pubkey']
          (root / 'updater.pub').write_text(key)
          PY
      - name: Sign production and validate against the app key
        if: inputs.publish
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 scripts/release-assets.py sign --version "$RELEASE_VERSION" --pubkey "$RUNNER_TEMP/updater.pub"
      - name: Preserve complete signed release for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: signed-release
          path: release-assets/*
          if-no-files-found: error

  docker-build:
    needs: [source, registry-preflight, manual-ci]
    if: always() && !cancelled() && needs.source.result == 'success' && needs.source.outputs.mode == 'build' && (needs.registry-preflight.result == 'success' || !inputs.publish) && (needs.manual-ci.result == 'success' || (!inputs.publish || github.workflow != 'Release') && needs.manual-ci.result == 'skipped')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          ref: ${{ needs.source.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and test the exact exported image without credentials
        env:
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ needs.source.outputs.sha }}
          CREATED: ${{ needs.source.outputs.created }}
          ARCH: ${{ matrix.arch }}
        run: |
          bash automation/scripts/install-regctl.sh "$RUNNER_TEMP/tools"
          export PATH="$RUNNER_TEMP/tools:$PATH"
          cd source
          python3 scripts/sdk-prepare.py
          docker buildx build --platform "linux/$ARCH" --provenance=false --sbom=false --no-cache \
            --build-arg "TUTABRIDGE_VERSION=$VERSION" --build-arg "TUTABRIDGE_REVISION=$SOURCE" \
            --build-arg "TUTABRIDGE_CREATED=$CREATED" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$SOURCE" \
            --label "org.opencontainers.image.created=$CREATED" \
            --label org.opencontainers.image.source=https://github.com/spartanz51/tutabridge \
            --label org.opencontainers.image.licenses=GPL-3.0-or-later \
            --output type=oci,dest=image.tar .
          regctl image import ocidir://smoke:release image.tar
          regctl image export ocidir://smoke:release --name tutabridge:test | docker load
          test "$(docker run --rm tutabridge:test --version)" = "tutabridge $VERSION"
          TUTABRIDGE_DOCKER_IMAGE=tutabridge:test python3 -m unittest discover -s scripts/tests -p test_docker_smoke.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: docker-${{ matrix.arch }}
          path: source/image.tar
          compression-level: 0
          if-no-files-found: error

  docker-package:
    needs: [source, docker-build]
    if: always() && !cancelled() && needs.source.result == 'success' && needs.docker-build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-amd64
          path: docker-archives/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-arm64
          path: docker-archives/arm64
      - name: Exercise transport and retries against disposable loopback registries
        env:
          TUTABRIDGE_TEST_REGISTRY: "1"
        run: |
          bash scripts/install-regctl.sh "$RUNNER_TEMP/tools"
          export PATH="$RUNNER_TEMP/tools:$PATH"
          python3 -m unittest discover -s scripts/tests -p test_docker_release.py -v
      - name: Validate both OCI archives and construct the canonical index
        env:
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ needs.source.outputs.sha }}
          SDK: ${{ needs.source.outputs.sdk }}
        run: python3 scripts/docker-release.py assemble --version "$VERSION" --source "$SOURCE" --sdk "$SDK" --run "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: docker-record
          path: docker-release.json
          if-no-files-found: error

  docker-push:
    needs: [source, build, docker-package, sign-production]
    if: always() && !cancelled() && inputs.publish && needs.source.result == 'success' && needs.build.result == 'success' && needs.sign-production.result == 'success' && (needs.docker-package.result == 'success' || needs.source.outputs.mode == 'resume')
    runs-on: ubuntu-24.04
    environment: docker-hub
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-record
      - name: Install reviewed registry client
        run: |
          bash scripts/install-regctl.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Reserve and transport canonical image bytes (no image execution)
        env:
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ needs.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_TOKEN" || { echo 'Missing named DOCKERHUB_TOKEN'; exit 1; }
          python3 scripts/docker-release.py attach-record --version "$VERSION" --source "$SOURCE"
          printf '%s' "$GH_TOKEN" | regctl registry login ghcr.io --user "$GITHUB_ACTOR" --pass-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | regctl registry login docker.io --user spartanz51 --pass-stdin
          python3 scripts/docker-release.py transport --version "$VERSION" --source "$SOURCE"

  docker-verify:
    needs: [source, docker-push]
    if: always() && !cancelled() && inputs.publish && needs.source.result == 'success' && (needs.docker-push.result == 'success' || needs.source.outputs.mode == 'repair')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-record
      - name: Anonymous native verification of both registries
        env:
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ needs.source.outputs.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/docker-release.py verify --version "$VERSION" --source "$SOURCE"
          digest=$(python3 -c 'import json; print(json.load(open("docker-release.json"))["index"]["digest"])')
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          mkdir -p "$DOCKER_CONFIG"
          for registry in ghcr.io/spartanz51/tutabridge docker.io/spartanz51/tutabridge; do
            image="$registry@$digest"
            docker pull --platform "linux/$ARCH" "$image"
            test "$(docker run --rm --network none "$image" --version)" = "tutabridge $VERSION"
          done
          python3 scripts/docker-release.py verify --version "$VERSION" --source "$SOURCE"

  publish:
    needs: [source, sign-production, docker-verify]
    if: always() && !cancelled() && inputs.publish && needs.source.result == 'success' && needs.sign-production.result == 'success' && needs.docker-verify.result == 'success'
    runs-on: ubuntu-24.04
    environment: docker-hub
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-record
          path: release-assets
      - name: Validate signed assets and publish only after Docker verification
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ needs.source.outputs.sha }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          git show "$SOURCE:src-tauri/tauri.conf.json" > "$RUNNER_TEMP/app-config.json"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); (p/"updater.pub").write_text(json.loads((p/"app-config.json").read_text())["plugins"]["updater"]["pubkey"])'
          python3 scripts/release-assets.py publish --require-docker --version "$VERSION" --source "$SOURCE" --pubkey "$RUNNER_TEMP/updater.pub"

  docker-latest:
    needs: [source, publish, docker-verify]
    if: always() && !cancelled() && inputs.publish && needs.source.result == 'success' && needs.docker-verify.result == 'success' && (needs.publish.result == 'success' || needs.source.outputs.mode == 'repair')
    runs-on: ubuntu-24.04
    environment: docker-hub
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-record
      - name: Install reviewed registry client
        run: |
          bash scripts/install-regctl.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Promote current public release and verify both latest tags
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ needs.source.outputs.sha }}
        run: |
          test -n "$DOCKERHUB_TOKEN" || { echo 'Missing named DOCKERHUB_TOKEN'; exit 1; }
          printf '%s' "$GH_TOKEN" | regctl registry login ghcr.io --user "$GITHUB_ACTOR" --pass-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | regctl registry login docker.io --user spartanz51 --pass-stdin
          python3 scripts/docker-release.py latest --version "$VERSION" --source "$SOURCE"
