name: Docker

on:
  push:
    branches: [main, develop]
    paths: ['Dockerfile', '.dockerignore', 'compose.yaml', 'docker/**', 'src/**', 'crates/**', 'sdk/**', 'Cargo.toml', 'Cargo.lock', '.gitmodules', 'tuta-repo', 'scripts/sdk-prepare.py', 'scripts/tests/test_docker*', 'scripts/docker-release.py', 'scripts/install-regctl.sh', 'scripts/build-docker-image.sh', 'scripts/docker-smoke.py', '.github/workflows/docker-build.yml', '.github/workflows/docker.yml']
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'compose.yaml', 'docker/**', 'src/**', 'crates/**', 'sdk/**', 'Cargo.toml', 'Cargo.lock', '.gitmodules', 'tuta-repo', 'scripts/sdk-prepare.py', 'scripts/tests/test_docker*', 'scripts/docker-release.py', 'scripts/install-regctl.sh', 'scripts/build-docker-image.sh', 'scripts/docker-smoke.py', '.github/workflows/docker-build.yml', '.github/workflows/docker.yml']

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Prepare and verify the pinned SDK
        run: python3 scripts/sdk-prepare.py
      - name: Install shell checker
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check entrypoint and unit tests
        run: |
          shellcheck docker/entrypoint.sh docker/bootstrap.sh docker/tests/run-real-pass.sh docker/bin/init docker/bin/password scripts/build-docker-image.sh
          python3 -m unittest discover -s scripts/tests -p 'test_docker_entrypoint.py' -v
          docker compose config --quiet
      - name: Build the CLI image
        run: docker build --tag tutabridge:test .
      - name: Build Linux test fixtures from the same source
        run: docker build --target test-binaries --output "type=local,dest=$RUNNER_TEMP/docker-test-binaries" .
      - name: Assert Linux subreaping and process-group cleanup
        run: |
          docker run --rm --network none --entrypoint /tmp/test-service \
            --mount "type=bind,src=$RUNNER_TEMP/docker-test-binaries/test-service,dst=/tmp/test-service,readonly" \
            tutabridge:test service::lifecycle_tests --nocapture
      - name: Check atomic persistence with real pass, GPG and Git
        run: |
          docker run --rm --network none --entrypoint bash \
            --mount "type=bind,src=$RUNNER_TEMP/docker-test-binaries/test-core,dst=/tmp/test-core,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/docker/tests/run-real-pass.sh,dst=/tmp/run-real-pass.sh,readonly" \
            tutabridge:test /tmp/run-real-pass.sh
      - name: Exercise pass, GPG and container lifecycle
        env:
          TUTABRIDGE_DOCKER_IMAGE: tutabridge:test
          TUTABRIDGE_HEALTH_TEST_BINARY: ${{ runner.temp }}/docker-test-binaries/test-service
        run: python3 -m unittest discover -s scripts/tests -p 'test_docker_smoke.py' -v

  transport:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Exercise transport and retries against disposable loopback registries
        env:
          TUTABRIDGE_TEST_REGISTRY: "1"
        run: |
          bash scripts/install-regctl.sh "$RUNNER_TEMP/tools"
          export PATH="$RUNNER_TEMP/tools:$PATH"
          python3 -m unittest discover -s scripts/tests -p test_docker_release.py -v
