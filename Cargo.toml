[workspace]
members = ["crates/bridge", "crates/tuta", "src-tauri"]
exclude = ["tuta-repo", "sdk/generated"]
resolver = "2"

[package]
name = "tutabridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.84.0"
license = "GPL-3.0-or-later"

[dependencies]
tutabridge-tuta = { path = "crates/tuta" }
tutabridge-core = { path = "crates/bridge" }
tuta-sdk = { path = "sdk/generated/tuta-sdk/rust/sdk", features = ["net"] }
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = { version = "0.26", features = ["ring"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
rpassword = "7"

serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
async-trait = "0.1"
crypto-primitives = { path = "sdk/generated/tuta-sdk/rust/crypto-primitives" }
rcgen = "0.13"
